[package]
name = "gestiune"
version = "0.0.0"
description = "Gestiune & Contabilitate - shell desktop"
edition = "2021"
rust-version = "1.77"

[lib]
name = "gestiune_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
