name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Anuleaza rularile in curs pentru acelasi branch/PR cand apare un push nou —
# nu are rost sa terminam o rulare pe cod deja inlocuit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Privilegiu minim: CI-ul doar citeste codul, nu are nevoie de scriere.
permissions:
  contents: read

jobs:
  lint-typecheck-test-build:
    name: Lint · Typecheck · Teste · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instaleaza dependintele
        run: npm ci

      - name: Lint (biome)
        run: npm run lint

      - name: Typecheck (toate pachetele)
        run: npm run typecheck

      - name: Teste unitare + componenta (toate pachetele)
        run: npm test

      - name: Build web (PWA)
        run: npm run build:web

  postgres:
    name: Integrare PostgreSQL (tranzactii + migratii)
    runs-on: ubuntu-latest
    needs: lint-typecheck-test-build
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gr
          POSTGRES_PASSWORD: gr
          POSTGRES_DB: gr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U gr"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      # Testul de integrare PG (server/src/pg-transaction.integration.test.ts) si
      # migratiile pe Postgres ruleaza DOAR cand DATABASE_URL e setat.
      DATABASE_URL: postgres://gr:gr@localhost:5432/gr_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Instaleaza dependintele
        run: npm ci
      - name: Teste server (inclusiv integrarea PostgreSQL reala)
        run: npm test --workspace=@gr/server

  dr-drill:
    name: Exercitiu DR (backup -> restaurare -> verificare)
    runs-on: ubuntu-latest
    needs: lint-typecheck-test-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Instaleaza dependintele
        run: npm ci
      # Un backup pe care nu l-ai test-restaurat NU e un backup. Acest job PROBEAZA
      # procedura reala de disaster-recovery pe fiecare push: creeaza o baza SQLite
      # cu date postate, o salveaza (backup probat + checksum), o restaureaza intr-o
      # baza NOUA si verifica integritatea — nu doar teste unitare, ci drill-ul in sine.
      - name: Ruleaza exercitiul DR
        run: npx tsx server/scripts/dr-drill.ts

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: lint-typecheck-test-build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instaleaza dependintele
        run: npm ci

      # Versiunea de Playwright determina versiunea de browser — cheia de cache
      # o include, ca sa reinstalam browserele doar cand se schimba versiunea.
      - name: Versiune Playwright
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache browsere Playwright
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Instaleaza Chromium + dependinte de sistem (Playwright)
        run: npx playwright install --with-deps chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'

      # La cache-hit, browserul e prezent dar dependintele de sistem (apt) nu —
      # le instalam separat, fara sa redescarcam browserul.
      - name: Instaleaza doar dependintele de sistem (la cache-hit)
        run: npx playwright install-deps chromium
        if: steps.pw-cache.outputs.cache-hit == 'true'

      - name: Teste e2e (login, configurare initiala, creare document)
        run: npm run test:e2e

      - name: Incarca raportul Playwright (la esec)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
